<!doctype html>
<html lang="%lang%">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#050816" />
        <!-- Вкладка: SVG у современных браузеров, ico — у остальных; iPhone — подробная призма -->
        <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
        <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />

        <!-- Без JS контент показывается сразу, анимации появления включаются только с ним -->
        <script>
            document.documentElement.classList.add('js')
        </script>

        <style>
            /* Курсива нет: font-style: italic браузер делает наклоном обычного начертания —
               у Montserrat курсив почти не отличается, а это минус два файла шрифтов */
            @font-face {
                font-family: 'Montserrat';
                font-style: normal;
                font-weight: 100 900;
                font-display: swap;
                src: url(%sveltekit.assets%/fonts/montserrat-cyrillic-wght-normal.woff2) format('woff2');
                unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
            }
            @font-face {
                font-family: 'Montserrat';
                font-style: normal;
                font-weight: 100 900;
                font-display: swap;
                src: url(%sveltekit.assets%/fonts/montserrat-latin-wght-normal.woff2) format('woff2');
                unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
            }
            @font-face {
                font-family: 'Rubik Mono One';
                font-style: normal;
                font-weight: 400;
                font-display: swap;
                src: url(%sveltekit.assets%/fonts/rubik-mono-one-cyrillic-400-normal.woff2) format('woff2');
                unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
            }
            @font-face {
                font-family: 'Rubik Mono One';
                font-style: normal;
                font-weight: 400;
                font-display: swap;
                src: url(%sveltekit.assets%/fonts/rubik-mono-one-latin-400-normal.woff2) format('woff2');
                unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
            }
        </style>

        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
