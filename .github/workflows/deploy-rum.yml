# Сервис метрик посетителей (deploy/rum): тесты (test.yml), сборка под Linux и перезапуск на сервере.
# В тестах и e2e сайта — они проверяют, что страница и сервис по-прежнему понимают друг друга.
# Юнит systemd CI не трогает — его правки выкладываются вручную (deploy/README.md)
name: Deploy RUM service

on:
  push:
    branches: [main]
    paths: ['deploy/rum/**', '!deploy/rum/**.md', '.github/workflows/deploy-rum.yml']
  workflow_dispatch:

concurrency:
  group: deploy-rum
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: deploy/rum
    env:
      RUM_DIR: /opt/portfolio-rum
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: deploy/rum/go.mod
          cache: false

      # Статический бинарник под сервер; архитектуру можно задать переменной SERVER_ARCH
      - run: go build -trimpath -ldflags='-s -w' -o portfolio-rum .
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ vars.SERVER_ARCH || 'amd64' }}

      - name: SSH-ключ и отпечаток сервера
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # ssh ищет ключ по тому имени, к которому подключается: запись для домена не подходит к IP
          if ! ssh-keygen -F "$SSH_HOST" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error::В SSH_KNOWN_HOSTS нет ключа для SSH_HOST — снимите его для того же имени: ssh-keyscan -t ed25519 <SSH_HOST> (deploy/README.md)"
            exit 1
          fi

      # Новый бинарник кладём рядом и подменяем через mv — работающий процесс не ломается.
      # sudo разрешён deploy-пользователю только для перезапуска этого сервиса
      - name: Выкладка и перезапуск
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key portfolio-rum "$TARGET:$RUM_DIR/portfolio-rum.new"
          ssh -i ~/.ssh/deploy_key "$TARGET" "
            set -e
            chmod 755 $RUM_DIR/portfolio-rum.new
            mv $RUM_DIR/portfolio-rum.new $RUM_DIR/portfolio-rum
            sudo -n systemctl restart portfolio-rum
          "

      # Сервис слушает только 127.0.0.1 — проверяем через nginx, как его видит сайт:
      # приём визитов, сводку и живую ленту для /stats. Поток не кончается — берём первые 3 с
      - name: Сервис отвечает
        run: |
          # Пустой визит сервис отклоняет (400) и не записывает — так видно, что POST до него
          # доходит. 301 — в nginx нет точного location = /api/rum, и браузеры теряют визиты
          # Без соединения curl падает раньше проверки кода — говорим, что сайт не отвечает вовсе
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST --data '{}' https://qwern9876r.ru/api/rum) || {
            echo "::error::https://qwern9876r.ru не отвечает (curl $?): nginx на сервере не запущен или порт 443 закрыт"
            exit 1
          }
          if [ "$code" != 400 ]; then
            echo "::error::POST /api/rum: $code вместо 400 — визиты не доходят до сервиса. В nginx нужен location = /api/rum из deploy/nginx.example.conf"
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            curl -fsS -o /dev/null https://qwern9876r.ru/api/rum/summary && break
            [ "$attempt" = 5 ] && exit 1
            sleep 2
          done
          live=$(curl -sN --max-time 3 https://qwern9876r.ru/api/rum/live || true)
          if ! grep -q '^event: snapshot' <<< "$live"; then
            echo "::error::/api/rum/live не отдаёт поток: в nginx нужен блок location ^~ /api/rum/ из deploy/nginx.example.conf"
            exit 1
          fi
          # Сайт на GitHub Pages читает сводку и ленту с другого домена: без CORS «Почему я»
          # и /stats молча останутся без данных
          origin='https://qwern-9876r.github.io'
          if ! curl -sS -o /dev/null -D - -H "Origin: $origin" https://qwern9876r.ru/api/rum/summary |
            grep -qi "^access-control-allow-origin: $origin"; then
            echo "::error::/api/rum/summary без Access-Control-Allow-Origin для $origin"
            exit 1
          fi
