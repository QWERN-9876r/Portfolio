# Сайт: тесты (test.yml) и выкладка проверенной сборки на GitHub Pages —
# https://qwern-9876r.github.io/Portfolio/. Свой сервер сайту не нужен: на нём только сервис
# метрик (deploy-rum.yml), и без него сайт работает. Контент живёт в бакете и попадает в сайт
# при сборке — после его правок запусти вручную (Actions → Run workflow). Настройка — deploy/README.md
name: Deploy site

on:
  push:
    branches: [main]
    # Сервис метрик и конфиги сервера выкладываются отдельно (deploy-rum.yml и вручную)
    paths-ignore: ['deploy/**', '.github/workflows/deploy-rum.yml']
  workflow_dispatch:

# Выкладки не наслаиваются: следующая ждёт окончания предыдущей
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE_URL: https://qwern-9876r.github.io/Portfolio
    steps:
      # Та самая сборка, на которой прошли e2e
      - uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist

      # GitHub Pages сжимает ответы сам: .gz и .br из сборки (по ним e2e меряют JS) ему не нужны
      - run: find dist \( -name '*.gz' -o -name '*.br' \) -delete

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

      # CDN Pages подхватывает новую версию не мгновенно — несколько попыток
      - name: Сайт и резюме отвечают
        run: |
          for path in en/ ru/ resume/dmitry-sotnikov-en.pdf resume/dmitry-sotnikov-ru.pdf; do
            for attempt in 1 2 3 4 5; do
              curl -fsS -o /dev/null "$SITE_URL/$path" && break
              [ "$attempt" = 5 ] && exit 1
              sleep 10
            done
          done
