      html,
      body {
        margin: 0;
        background: #050816;
      }

      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse 60% 50% at 50% 50%, rgba(41, 121, 255, 0.12) 0%, transparent 70%),
          #050816;
        transition:
          opacity 0.45s ease-in-out,
          transform 0.45s ease-in-out,
          filter 0.45s ease-in-out;
      }
      #preloader.is-done {
        opacity: 0;
        transform: scale(1.04);
        filter: blur(12px);
        pointer-events: none;
      }
      #pl-particles i {
        position: absolute;
        border-radius: 50%;
        background: #2979ff;
        opacity: var(--o);
        animation: pl-twinkle ease-in-out infinite both;
      }
      .pl-center {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .pl-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 300px;
        height: 80px;
        border-radius: 50%;
        background: rgba(41, 121, 255, 0.15);
        filter: blur(32px);
        transform: translate(-50%, -50%);
      }
      .pl-nick {
        margin: 0;
        font-family: 'Rubik Mono One', monospace;
        font-size: clamp(1.5rem, 3.5vw, 2.75rem);
        font-weight: 400;
        line-height: 1.15;
        letter-spacing: 0.04em;
        text-align: center;
        color: #e8eaf6;
        animation: pl-nick-in 0.4s 0.05s ease-out both;
      }
      .pl-nick span {
        color: #448aff;
        text-shadow: 0 0 20px rgba(41, 121, 255, 0.8);
      }
      .pl-line {
        width: 100%;
        height: 1px;
        background: linear-gradient(90deg, transparent, #2979ff, #448aff, transparent);
        box-shadow: 0 0 8px rgba(41, 121, 255, 0.6);
        transform-origin: 0 50%;
        animation: pl-line-in 0.6s 0.15s ease-in-out both;
      }
      .pl-caption {
        font-family: 'Montserrat', sans-serif;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #7986cb;
        animation: pl-fade-in 0.4s 0.25s both;
      }
      @keyframes pl-twinkle {
        0% {
          opacity: 0;
          transform: translateY(0) scale(0);
        }
        33% {
          opacity: var(--o);
          transform: translateY(-12px) scale(1);
        }
        66% {
          opacity: calc(var(--o) * 0.5);
          transform: translateY(4px) scale(0.8);
        }
        100% {
          opacity: var(--o);
          transform: translateY(-8px) scale(1);
        }
      }
      @keyframes pl-nick-in {
        from {
          opacity: 0;
          transform: translateY(24px);
          filter: blur(8px);
        }
      }
      @keyframes pl-line-in {
        from {
          opacity: 0;
          transform: scaleX(0);
        }
      }
      @keyframes pl-fade-in {
        from {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader,
        #preloader * {
          animation: none !important;
          transition: none !important;
        }
      }

        document.getElementById('pl-particles').innerHTML = html

        }
