# Сайт живёт на GitHub Pages за своим доменом: https://qwern9876r.ru (custom domain в Settings →
# Pages, DNS апекса — A-записи на IP Pages). Этот сервер DNS апекса больше не обслуживает —
# только свой поддомен для сервиса метрик (deploy/rum), у него отдельная A-запись на IP сервера.
# Лежит сервер — сайт работает, пропадают только метрики: deploy/README.md

server {
    listen 443 ssl;
    http2 on;
    server_name rum.qwern9876r.ru;

    # Метрики посетителей: принимаем только POST небольшого размера. Страница на другом
    # домене — заголовки CORS для неё ставит сам сервис
    location = /api/rum {
        limit_except POST { deny all; }
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8090;
    }

    # Сводка и живая лента визитов для /stats (Server-Sent Events): поток отдаётся сразу,
    # без буфера. Сервис пингует раз в 25 с — укладывается в proxy_read_timeout по умолчанию
    location ^~ /api/rum/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
    }

    # Сюда заходят только за /api/rum*; случайный визит на голый поддомен — на сайт
    location / {
        return 301 https://qwern9876r.ru$request_uri;
    }
}
