# Сайт живёт на GitHub Pages: https://qwern-9876r.github.io/Portfolio/ (deploy-site.yml).
# На сервере остаются сервис метрик посетителей (deploy/rum) и переадресация старых ссылок.
# Лежит сервер — сайт работает, пропадают только метрики

server {
    listen 443 ssl;
    http2 on;
    server_name qwern9876r.ru www.qwern9876r.ru;

    # Метрики посетителей: принимаем только POST небольшого размера. Страница на другом
    # домене — заголовки CORS для неё ставит сам сервис
    location = /api/rum {
        limit_except POST { deny all; }
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8090;
    }

    # Сводка и живая лента визитов для /stats (Server-Sent Events): поток отдаётся сразу,
    # без буфера. Сервис пингует раз в 25 с — укладывается в proxy_read_timeout по умолчанию
    location ^~ /api/rum/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
    }

    # Всё остальное — на сайт с тем же путём: /en/backend → …/Portfolio/en/backend
    # (GitHub Pages сам добавит слэш на конце). Старые ?role= сайт разбирает сам
    location / {
        return 301 https://qwern-9876r.github.io/Portfolio$request_uri;
    }
}
