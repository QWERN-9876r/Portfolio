# Пример server-блока для статической сборки SvelteKit (npm run build → dist/).
# Пути страниц без слэша: /en → dist/en.html, /en/backend → dist/en/backend.html

server {
    listen 443 ssl;
    http2 on;
    server_name qwern9876r.ru www.qwern9876r.ru;

    root /var/www/portfolio/dist;

    # adapter-static с precompress кладёт рядом .gz и .br
    gzip_static on;
    # brotli_static on;  # если nginx собран с модулем ngx_brotli

    location = / {
        return 302 /en;
    }

    # Старые ссылки вида /en?role=backend
    location ~ ^/(?<lang>en|ru)$ {
        if ($arg_role ~ ^(?<legacy_role>fullstack|backend)$) {
            return 301 /$lang/$legacy_role;
        }
        if ($arg_role = frontend) {
            return 301 /$lang;
        }
        add_header Cache-Control "no-cache";
        try_files $uri.html =404;
    }

    # HTML и __data.json — всегда свежие после деплоя
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Манифест PWA (/en/manifest.webmanifest): в старых mime.types нет этого расширения.
    # service-worker.js попадает в location / — no-cache, чтобы обновления доходили сразу
    location ~ \.webmanifest$ {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Метрики посетителей (deploy/rum): принимаем только POST небольшого размера
    location = /api/rum {
        limit_except POST { deny all; }
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8090;
    }

    location = /api/rum/summary {
        proxy_pass http://127.0.0.1:8090;
    }

    # ^~ — чтобы regex-локации ниже не перехватывали эти префиксы
    location ^~ /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Текущий прокси к бакету: иконки и свежий JSON для обновления контента в браузере
    location ^~ /api/storage/ {
        proxy_pass https://storage.yandexcloud.net/qwern-9876r/;
        proxy_set_header Host storage.yandexcloud.net;
        proxy_ssl_server_name on;
    }

    location ~* \.(?:woff2|avif|webp|jpg|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
}
